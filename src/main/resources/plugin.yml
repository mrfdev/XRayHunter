name: @pluginName@
main: @pluginMain@
version: @version@
api-version: '@pluginApiVersion@'
authors: [R4zorax, mrfloris]
depend: [CoreProtect]
description: CoreProtect 24.0-dev1 add-on for suspicious mining stats, compiled against Paper API @paperApiCompileVersion@ and targeting Java @javaTarget@.
prefix: XRayHunter
commands:
  xrayhunter:
    aliases: [xhunt, xr]
    usage: |
      /xrayhunter help
      /xrayhunter info
      /xrayhunter lookup [time|alltime] [world|allworlds] [-all]
      /xrayhunter <time|alltime>
      /xrayhunter detail <index|player> [page]
      /xrayhunter teleport <index>
      /xrayhunter debug [help|permissions|commands|config]
      /xrayhunter debug set <key> <value>
      /xrayhunter debug whitelist <player|list|add|remove>
      /xrayhunter reload
    description: Inspect CoreProtect mining data from loaded and archived worlds, plus cached details and debug/config info.

permissions:
  xrayhunter.use:
    description: Allows lookup, detail, and teleport subcommands.
    default: op
  xrayhunter.admin:
    description: Allows debug pages, config updates, and reload.
    default: op
    children:
      xrayhunter.use: true
      xhunt.use: true
  xhunt.use:
    description: Legacy alias for xrayhunter.use.
    default: op
    children:
      xrayhunter.use: true
  xhunt.admin:
    description: Legacy alias for xrayhunter.admin.
    default: op
    children:
      xhunt.use: true
      xrayhunter.use: true
